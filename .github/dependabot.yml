version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tales-webui"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(webui)"
    #      include: "scope"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/tales"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(tales)"
    #      include: "scope"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/tales-tray"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(tales-tray)"
    #      include: "scope"
    schedule:
      interval: "weekly"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "deps(ci)"
    #      include: "scope"
    schedule:
      interval: "weekly"
