name: ShelfView CI

# SV-700: continuous integration for the ShelfView/Web-Hanji fork.
# Jobs are gated by change scope so unrelated edits do not run the whole pipeline.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelfview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'komga/**'
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
            frontend:
              - 'komga-webui/**'
            docker:
              - 'komga/docker/**'
              - '.github/workflows/shelfview-ci.yml'

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run backend tests
        run: ./gradlew :komga:test

  frontend:
    name: Frontend lint, test and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komga-webui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: komga-webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  docker-build:
    name: Docker image build (amd64 smoke)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build boot jar
        run: ./gradlew :komga:bootJar
      - name: Stage jar and render Dockerfile from template
        run: |
          set -euo pipefail
          jar="$(ls komga/build/libs/komga-*.jar | grep -v -- '-plain.jar' | head -n1)"
          if [ -z "$jar" ]; then
            echo "Boot jar not found in komga/build/libs" >&2
            exit 1
          fi
          echo "Using boot jar: $jar"
          mkdir -p komga/docker/assembly
          cp "$jar" komga/docker/assembly/
          sed "s|{{distributionArtifactFile}}|$(basename "$jar")|g" \
            komga/docker/Dockerfile.tpl > komga/docker/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: komga/docker
          file: komga/docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: shelfview:ci
