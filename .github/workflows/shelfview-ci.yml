name: Tales CI

# SV-700: continuous integration for Tales/Web-Tales.
# Jobs are gated by change scope so unrelated edits do not run the whole pipeline.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tales-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'tales/**'
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
            frontend:
              - 'tales-webui/**'
            docker:
              - 'tales/docker/**'
              - '.github/workflows/shelfview-ci.yml'

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run backend tests
        run: ./gradlew :tales:test

  frontend:
    name: Frontend lint, test and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tales-webui
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: tales-webui/package-lock.json
      - name: Setup npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Skip the slow fork-ts-checker type-check in CI (kept in local dev/build)
          SHELFVIEW_SKIP_TSCHECK: 'true'

  docker-build:
    name: Docker image (version, non-root, health check)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build boot jar
        run: ./gradlew :tales:bootJar
      - name: Stage jar and render hardened Dockerfile
        id: render
        run: |
          set -euo pipefail
          jar="$(ls tales/build/libs/tales-*.jar | grep -v -- '-plain.jar' | head -n1)"
          if [ -z "$jar" ]; then
            echo "Boot jar not found in tales/build/libs" >&2
            exit 1
          fi
          echo "Using boot jar: $jar"
          mkdir -p tales/docker/assembly
          cp "$jar" tales/docker/assembly/
          bash tales/docker/render-shelfview-dockerfile.sh \
            tales/docker/Dockerfile.tpl "$(basename "$jar")" tales/docker/Dockerfile
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image - amd64 (priority, loaded)
        uses: docker/build-push-action@v6
        with:
          context: tales/docker
          file: tales/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tales:ci
          build-args: |
            SHELFVIEW_VERSION=${{ steps.render.outputs.version }}
            SHELFVIEW_REVISION=${{ github.sha }}
      - name: Inspect image labels
        run: docker image inspect tales:ci --format '{{json .Config.Labels}}'
      - name: Validate image - arm64 (build only)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: tales/docker
          file: tales/docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: tales:ci-arm64
          build-args: |
            SHELFVIEW_VERSION=${{ steps.render.outputs.version }}
            SHELFVIEW_REVISION=${{ github.sha }}
