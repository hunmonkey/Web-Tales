services:
  shelfview:
    image: ghcr.io/YOUR_GITHUB_ACCOUNT/shelfview:0.1.0
    container_name: shelfview
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      # Adjust after measuring on your server.
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx2g}"
    ports:
      - "${SHELFVIEW_PORT:-25600}:25600"
    volumes:
      - /mnt/user/appdata/shelfview/config:/config
      - /mnt/user/appdata/shelfview/cache:/cache
      - /mnt/user/media/books:/data:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

# Notes:
# - Keep /data read-only.
# - Put appdata on a persistent local pool and back up /config.
# - Pin a version tag for production rather than relying only on latest.
# - Confirm UID/GID against your Unraid share permissions.
